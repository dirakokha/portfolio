# انتشار روی GitHub Pages — فقط اگر مخزن «عمومی» باشد (پلن رایگان GitHub).
# مسیر اصلی و پیشنهادی، Cloudflare Pages است؛ این گردش‌کار جایگزین است.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build
        env:
          SITE_URL: ${{ vars.SITE_URL || format('https://{0}.github.io', github.repository_owner) }}
          BASE_PATH: /${{ github.event.repository.name }}
          # اگر پروکسی ورود (workers/oauth) را جداگانه منتشر کردید، این را تنظیم کنید
          OAUTH_BASE_URL: ${{ vars.OAUTH_BASE_URL }}
        run: npm run build
      - uses: actions/configure-pages@v5
        with:
          # اگر Pages هنوز فعال نشده باشد، با مجوز pages: write فعال می‌شود
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
