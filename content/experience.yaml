# تجربهٔ کاری

items:
  - organization: مجموعهٔ مسیر روشن
    role: پشتیبانی فناوری اطلاعات و همکاری در تولید محتوا
    start_label: آذر ۱۴۰۴
    end_label: آذر ۱۴۰۴
    duration_label: یک ماه
    employment: تمام‌وقت
    location: تهران
    summary: >-
      یک ماه تمام‌وقت در تیمی کوچک؛ ترکیبی از پشتیبانی سیستم‌های کامپیوتری و
      کمک به تولید محتوای شبکه‌های اجتماعی.
    groups:
      - title: پشتیبانی سیستم
        items:
          - نصب و آماده‌سازی ویندوز
          - نصب نرم‌افزار و درایور
          - آماده‌سازی و نگهداری روتین کامپیوترها
          - عیب‌یابی مشکلات سخت‌افزاری و نرم‌افزاری
          - رسیدگی به مشکلات اینترنت و پرینتر
      - title: تولید محتوا
        items:
          - ویرایش تصویر با Adobe Photoshop
          - تدوین و تولید ویدیو با Adobe Premiere Pro
          - همکاری در ایده‌پردازی، برنامه‌ریزی و اجرای محتوا
          - آماده‌سازی و انتشار محتوا برای اینستاگرام و یوتیوب
          - استفاده از ابزارهای هوش مصنوعی در بخشی از فرایند تولید محتوا
    note: >-
      این تجربه یک ماه بوده است؛ بنابراین نه مدیریت تیم، نه بودجه و نه آمار
      عملکردی در آن وجود دارد. صفحه‌های اینستاگرام و یوتیوب مجموعه متعلق به
      «مسیر روشن» است و در این سایت به‌عنوان حساب شخصی معرفی نمی‌شود.
    tags:
      - Windows
      - IT Support
      - Photoshop
      - Premiere Pro
      - Content
