# بخش «درباره» — قابل ویرایش از پنل مدیریت

title: درباره
lead: >-
  من امیرمحمود خاکنه هستم؛ دانشجوی کاردانی فناوری اطلاعات و اینترنت و شبکه‌های
  گسترده در دانشگاه علمی‌کاربردی گسترش انفورماتیک ایران، ساکن رودهن.

paragraphs:
  - >-
    مسیرم از همان‌جایی شروع شد که بیشتر آدم‌های فنی شروع می‌کنند: یک کامپیوتر
    که روشن نمی‌شد. از آن‌جا یاد گرفتم نصب ویندوز، درایور و نرم‌افزار فقط بخش
    کوچکی از کار است؛ بخش اصلی، پیدا کردن دلیلِ خرابی است. همین کنجکاوی باعث شد
    به سمت شبکه، برنامه‌نویسی و بعد تولید محتوا بروم.
  - >-
    در آذر ۱۴۰۴ یک ماه تمام‌وقت در مجموعهٔ «مسیر روشن» کار کردم. نیمی از روز با
    سیستم‌ها و پرینترها و اینترنت سر و کله می‌زدم و نیم دیگر با فتوشاپ و پریمیر؛
    ایده می‌دادم، محتوا می‌ساختم و برای اینستاگرام و یوتیوب منتشر می‌کردم. این
    تجربه کوتاه بود، اما دقیقاً نشان داد که کار فنی و کار خلاقانه در عمل از هم
    جدا نیستند.
  - >-
    الان تمرکزم روی برنامه‌نویسی است. دورهٔ جامع پایتون را در مکتب‌خونه گذرانده‌ام
    و در حال یادگیری HTML، CSS و JavaScript هستم. هدف کوتاه‌مدت این است که در یک
    تیم فنی، همکار قابل اتکایی باشم؛ کسی که مشکل را نه‌تنها حل می‌کند، بلکه آن را
    مستند می‌کند تا دوباره تکرار نشود.

# واقعیت‌های کوتاه که در حاشیهٔ بخش نمایش داده می‌شوند
facts:
  - label: محل زندگی
    value: رودهن، استان تهران
  - label: رشتهٔ تحصیلی
    value: فناوری اطلاعات و شبکه‌های گسترده
  - label: تمرکز فعلی
    value: برنامه‌نویسی وب و پشتیبانی سیستم
  - label: زبان
    value: فارسی (زبان مادری) — انگلیسی (خواندن و شنیدن)

quote: >-
  فناوری وقتی ارزش دارد که کسی را از یک مشکل نجات بدهد؛ بقیه‌اش جزئیات است.
