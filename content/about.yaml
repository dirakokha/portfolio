# بخش «درباره» — قابل ویرایش از پنل مدیریت

title: درباره
lead: >-
  دانشجوی کاردانی فناوری اطلاعات و اینترنت و شبکه‌های گسترده در دانشگاه
  علمی-کاربردی گسترش انفورماتیک ایران.

paragraphs:
  - >-
    کامپیوتر از بچگی توی خانهٔ ما بود؛ اولش بازی می‌کردم. بعد رفتم سراغ وبلاگ‌نویسی،
    بعد تولید محتوا و در آخر برنامه‌نویسی. کار با ویندوز و درایور هم همان سال‌ها
    دستم آمد و فهمیدم اصل ماجرا پیدا کردن دلیل خرابی است.
  - >-
    جدی‌ترین فعالیتم در تولید محتوا همان یک ماهی بود که در آکادمی مسیر روشن کار
    کردم. بیشتر وقت‌ها یا ادیت می‌کردم یا دنبال ایده برای ضبط ویدیو بودم؛ گاهی هم
    اگر مشکلی برای سیستم‌های آن‌جا پیش می‌آمد، خودم حلش می‌کردم.
  - >-
    الان در کنار یاد گرفتن HTML، CSS و JavaScript سعی می‌کنم با ابزارهای هوش
    مصنوعی هم بیشتر کار کنم و خودم را به‌روز نگه دارم.
  - >-
    هنوز نمونه‌کار زیادی ندارم — فعلاً همین چک‌لیست نصب ویندوز — ولی در صورت نیاز
    برای همون کار می‌سازم.

facts:
  - label: رشتهٔ تحصیلی
    value: فناوری اطلاعات و شبکه‌های گسترده
  - label: تمرکز فعلی
    value: برنامه‌نویسی و یادگیری وب
  - label: زبان
    value: انگلیسی — در حال یادگیری
